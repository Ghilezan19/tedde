# Nginx reverse proxy: video.tedde-auto.ro
# Next.js  → 127.0.0.1:3000
# FastAPI  → 127.0.0.1:8000
#
# TLS: files under /etc/nginx/ssl/video.tedde-auto.ro/ (self-signed: deploy/ensure-ssl-tedde.sh;
#      or swap for Let's Encrypt paths after certbot).
#
# ORDERING: shared locations in includes/video.tedde-auto.ro.locations.conf (must exist under
# /etc/nginx/includes/ — copied by install_nginx_proxy.sh)

# -----------------------------------------------------------------------------
# HTTP — ACME (Let's Encrypt) + același proxy ca HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name video.tedde-auto.ro;

    client_max_body_size 500M;

    proxy_connect_timeout       300s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;
    send_timeout                300s;

    access_log /var/log/nginx/video.tedde-auto.ro.access.log;
    error_log  /var/log/nginx/video.tedde-auto.ro.error.log;

    # Certbot / certonly --webroot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/includes/video.tedde-auto.ro.locations.conf;
}

# -----------------------------------------------------------------------------
# HTTPS
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name video.tedde-auto.ro;

    # Populated by: sudo deploy/ensure-ssl-tedde.sh
    # After Let's Encrypt, point these to /etc/letsencrypt/live/video.tedde-auto.ro/ (see same script, LE mode)
    ssl_certificate     /etc/nginx/ssl/video.tedde-auto.ro/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/video.tedde-auto.ro/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 500M;

    proxy_connect_timeout       300s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;
    send_timeout                300s;

    access_log /var/log/nginx/video.tedde-auto.ro.ssl.access.log;
    error_log  /var/log/nginx/video.tedde-auto.ro.ssl.error.log;

    include /etc/nginx/includes/video.tedde-auto.ro.locations.conf;
}
