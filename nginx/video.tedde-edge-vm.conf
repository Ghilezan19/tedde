# Nginx on the *public edge VM* only: terminate TLS and proxy to the Tedde stack on the
# laptop over Tailscale (FastAPI 8000, Next 3000). App is NOT on this machine.
#
# Prerequisites:
#   - DNS A/AAAA for video.tedde-auto.ro point to *this* VM's public IP
#   - Copy includes/video.tedde-auto.ro.edge-locations.conf to /etc/nginx/includes/
#   - Set $tedde_laptop below to the laptop's Tailscale IP (e.g. 100.90.57.70), or
#     use a MagicDNS name if the VM can resolve it
#   - On the laptop: UVICORN_HOST=0.0.0.0, NEXT_HOST=0.0.0.0, and UFW for VM Tailscale only
#   - TLS: certbot on the VM, then point ssl_certificate* to /etc/letsencrypt/live/...
#
# Enable (Debian/Ubuntu):
#   sudo install -D -m 0644 video.tedde-edge-vm.conf /etc/nginx/sites-available/video.tedde-edge-vm
#   sudo install -D -m 0644 includes/video.tedde-auto.ro.edge-locations.conf /etc/nginx/includes/
#   sudo ln -sf /etc/nginx/sites-available/video.tedde-edge-vm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# -----------------------------------------------------------------------------
# HTTP — ACME + same proxy as HTTPS (or redirect to 443)
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name video.tedde-auto.ro;

    set $tedde_laptop 100.90.57.70;

    client_max_body_size 500M;

    proxy_connect_timeout       300s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;
    send_timeout                300s;

    access_log /var/log/nginx/video.tedde-auto.ro.edge.http.access.log;
    error_log  /var/log/nginx/video.tedde-auto.ro.edge.http.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/includes/video.tedde-auto.ro.edge-locations.conf;
}

# -----------------------------------------------------------------------------
# HTTPS
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name video.tedde-auto.ro;

    set $tedde_laptop 100.90.57.70;

    # Before certbot: use self-signed paths from deploy/ensure-ssl-tedde.sh on the VM, e.g.:
    # ssl_certificate     /etc/nginx/ssl/video.tedde-auto.ro/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/video.tedde-auto.ro/privkey.pem;
    ssl_certificate     /etc/letsencrypt/live/video.tedde-auto.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.tedde-auto.ro/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 500M;

    proxy_connect_timeout       300s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;
    send_timeout                300s;

    access_log /var/log/nginx/video.tedde-auto.ro.edge.ssl.access.log;
    error_log  /var/log/nginx/video.tedde-auto.ro.edge.ssl.error.log;

    include /etc/nginx/includes/video.tedde-auto.ro.edge-locations.conf;
}
